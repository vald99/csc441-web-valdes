<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <!-- Class 16: Step 1: my contact page -->
        <title>Contact - Yandel Valdes</title>
        <!-- Class 12: Step 1: a typeface I choose -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <!-- Class 15: Step 1: my third file -->
        <script src="script.js" defer></script>
    </head>
    <body>
        <!-- Class 13: Step 2: navigation -->
        <nav>
            <ul>
                <!-- Lab 13: Task 1: which page am I on -->
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <!-- Lab 13: Task 2: my third page -->
                <li><a href="artwork.html">Artwork</a></li>
                <!-- Class 16: Step 1: the contact link -->
                <li><a href="contact.html" class="current">Contact</a></li>
                <!-- Class 15: Step 3: the theme button -->
                <li><button id="theme-toggle" type="button">Dark</button></li>
            </ul>
        </nav>
        <!-- Class 11: Step 2: the page content -->
        <!-- Lab 12: Task 1: group the text so it stacks beside the photo -->
        <header>
            <!-- Class 12: Step 3: an image -->
            <img src="images/me.jpg" alt="Portrait of Yandel Valdes" class="portrait">
            <div>
                <h1>Contact</h1>
                <p>See Frequently Asked Questions here, or submit your own!</p>
            </div>
        </header>

        <main>
            <!-- Class 16: Step 2: a form -->
            <form id="contact-form">
                <p>
                    <label for="name">Your name</label>
                    <input id="name" name="name" type="text" required>
                </p>

                <p>
                    <label for="email">Your email</label>
                    <input id="email" name="email" type="email" required>
                </p>

                <p>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </p>

                <button type="submit">Send</button>

            </form>

            <p id="form-status" role="status"></p>
        </main>
        <!-- Lab 12: Task 3: two things in the footer -->
        <footer>
            <!-- Class 15: Step 2: the year, written by JavaScript -->
            <p>© <span id="year"></span> Yandel Valdes</p>
            <!-- Lab 11: Task 3: a link off my page -->
            <a href="https://github.com/vald99" target="_blank" rel="noopener">GitHub</a>
        </footer>
    </body>
</html>
